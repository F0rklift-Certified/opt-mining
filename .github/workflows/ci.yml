name: CI

# Continuous integration for the Opt-Mining geospatial pipeline.
#
# Runs the pytest suite (tests/, discovered via pytest.ini) on every push and
# pull request against the single supported interpreter.
#
# IMPORTANT — Python version policy:
#   The project standardises on Python 3.13. CI tests exactly that version so
#   the code only claims what CI verifies; this mirrors requires-python
#   (">=3.13,<3.14") in pyproject.toml. Python 3.14 is EXCLUDED because the
#   S1-02 grid builder (pipeline/grid/generate.py) emits degenerate zero-area
#   cells on CPython 3.14.x, silently corrupting the grid and every feature
#   layer that joins to it. Do not add 3.14 here until the upstream issue is
#   resolved. If the team later needs to support older interpreters, widen both
#   this matrix and requires-python together.

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r app/api/requirements.txt
          # pytest is the test runner but is not a runtime dependency, so it is
          # not in requirements.txt. Pinned here to the version verified locally
          # on Python 3.13. hypothesis (used by property tests) is pinned in
          # requirements.txt and installed above.
          pip install pytest==9.1.1

      - name: Run S2-09 backend integration gate
        run: pytest -v tests/backend

      - name: Run remaining unit and integration tests
        run: pytest -v --ignore=tests/backend

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --runInBand

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
