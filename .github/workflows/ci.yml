name: CI

# Continuous integration for the Opt-Mining geospatial pipeline.
#
# Runs the pytest suite (tests/, discovered via pytest.ini) on every push and
# pull request against the single supported interpreter.
#
# IMPORTANT — Python version policy:
#   The project standardises on Python 3.13. CI tests exactly that version so
#   the code only claims what CI verifies; this mirrors requires-python
#   (">=3.13,<3.14") in pyproject.toml. Python 3.14 is EXCLUDED because the
#   S1-02 grid builder (pipeline/grid/generate.py) emits degenerate zero-area
#   cells on CPython 3.14.x, silently corrupting the grid and every feature
#   layer that joins to it. Do not add 3.14 here until the upstream issue is
#   resolved. If the team later needs to support older interpreters, widen both
#   this matrix and requires-python together.

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r app/api/requirements.txt
          # pytest and httpx support the test harness but are not runtime
          # dependencies, so they are kept out of the production manifests.
          # Pin both to the versions verified locally on Python 3.13.
          # hypothesis (used by property tests) is installed above.
          pip install pytest==9.1.1 httpx==0.28.1

      - name: Run S2-09 backend test gate
        # The Docker Compose smoke test is intentionally opt-in because hosted
        # runners cannot reliably complete image builds within its bounded
        # readiness timeout. It remains runnable with: pytest -m integration.
        run: pytest -v -m "not integration" tests/backend

      - name: Run remaining non-Docker tests
        run: pytest -v -m "not integration" --ignore=tests/backend

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    # Build both Compose images so a broken image build fails CI instead of
    # only surfacing on a developer's machine. This is build-only on purpose:
    # it catches build-time failures (e.g. a stale host node_modules leaking in
    # via COPY, or a missing .dockerignore) without the flaky readiness wait
    # that keeps the full `docker compose up` smoke test (tests/backend/
    # test_compose_stack_integration.py, marked `integration`) opt-in. Bringing
    # the stack up and health-checking it remains available via `pytest -m
    # integration`.
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Compose images
        working-directory: app
        run: docker compose build

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --runInBand

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
