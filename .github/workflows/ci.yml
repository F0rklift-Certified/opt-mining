name: CI

# Continuous integration for the Opt-Mining geospatial pipeline.
#
# Runs the pytest suite (tests/, discovered via pytest.ini) on every push and
# pull request against the single supported interpreter.
#
# IMPORTANT — Python version policy:
#   The project standardises on Python 3.13. CI tests exactly that version so
#   the code only claims what CI verifies; this mirrors requires-python
#   (">=3.13,<3.14") in pyproject.toml. Python 3.14 is EXCLUDED because the
#   S1-02 grid builder (pipeline/grid/generate.py) emits degenerate zero-area
#   cells on CPython 3.14.x, silently corrupting the grid and every feature
#   layer that joins to it. Do not add 3.14 here until the upstream issue is
#   resolved. If the team later needs to support older interpreters, widen both
#   this matrix and requires-python together.

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r app/api/requirements.txt
          # pytest and httpx support the test harness but are not runtime
          # dependencies, so they are kept out of the production manifests.
          # Pin both to the versions verified locally on Python 3.13.
          # hypothesis (used by property tests) is installed above.
          pip install pytest==9.1.1 httpx==0.28.1

      - name: Run S2-09 backend test gate
        # The Docker Compose smoke test is intentionally opt-in because hosted
        # runners cannot reliably complete image builds within its bounded
        # readiness timeout. It remains runnable with: pytest -m integration.
        run: pytest -v -m "not integration" tests/backend

      - name: Run remaining non-Docker tests
        run: pytest -v -m "not integration" --ignore=tests/backend

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    # Build and boot both images, then exercise the same six HTTP operations
    # as the browser. A successful image build alone cannot catch import-time
    # shared-library errors, missing input data or rejected CORS requests.
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Compose images
        working-directory: app
        run: docker compose build

      - name: Start Compose stack
        working-directory: app
        run: docker compose up -d

      - name: Verify browser-facing service operations
        run: python3 app/smoke_test.py

      - name: Record S3-10 live service rehearsal
        # API success is technical evidence; missing web/client acceptance is
        # retained as BLOCKED in the report rather than silently marked done.
        run: python3 app/rehearse_demo.py --output outputs/s3-10-rehearsal.json

      - name: Set up browser-test Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Test real browser against Compose
        working-directory: app/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Save S3-10 rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-10-live-rehearsal
          path: |
            outputs/s3-10-rehearsal.json
            app/web/test-results/
          if-no-files-found: warn

      - name: Show container logs on failure
        if: failure()
        working-directory: app
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        working-directory: app
        run: docker compose down

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --runInBand

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
