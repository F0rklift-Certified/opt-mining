[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    depends_on_16_1: doc-consistency assertions that depend on task 16.1 updating pipeline/README.md (may fail transiently until 16.1 lands)
    integration: slow, CI-tier tests that stand up external processes/containers (e.g. `docker compose up --build`); excluded from the fast unit suite. Run with `pytest -m integration`; exclude with `pytest -m "not integration"`. Skips gracefully when its runtime (e.g. Docker) is unavailable.
